name: Update visual baselines

# Run this after an intended UI change. It re-takes every screenshot in WebKit
# and pushes them to the visual-baselines branch for review.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --update-snapshots=all

      # Baselines are pushed to a branch for review, not straight to the branch
      # the workflow ran on: look at every changed image before merging.
      - name: Push baselines for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout -B visual-baselines
          git commit -m "Update visual baselines"
          git push --force origin visual-baselines
          compare="https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}...visual-baselines"
          echo "Review the changed images: $compare" >> "$GITHUB_STEP_SUMMARY"
          gh pr create --base "${{ github.ref_name }}" --head visual-baselines \
            --title "Update visual baselines" \
            --body "Review every changed image before merging." || true
