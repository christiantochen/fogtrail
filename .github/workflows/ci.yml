name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A change that only touches docs skips the heavy jobs below. They are skipped
  # with `if`, not with `paths-ignore`, so a required check still reports.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            echo "$files"
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(.*\.md|docs/.*|LICENSE-.*|\.editorconfig|\.github/ISSUE_TEMPLATE/.*)$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    # No matrix, so the name is the same whether the job runs or is skipped.
    name: Check (windows-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS runners are scarce, so macOS is checked weekly in macos.yml
    # and at release time instead of on every push.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # The frontend must be built first: tauri::generate_context! reads ../dist.
      - run: npm run build

      - name: rustfmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      # Unit tests only; the integration tests skip without a server (see below).
      - name: cargo test
        run: cargo test
        working-directory: src-tauri

  integration:
    name: Redis integration (ubuntu)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FOGTRAIL_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      # Throwaway server, throwaway passwords: see scripts/seed-mysql.sql.
      FOGTRAIL_TEST_MYSQL_URL: mysql://fogtrail_ro:ro-test-pw@127.0.0.1:3306/shop
      FOGTRAIL_TEST_MYSQL_RW_URL: mysql://fogtrail_rw:rw-test-pw@127.0.0.1:3306/shop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tauri crate links WebKitGTK on Linux, so it has to be present to compile.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - run: npm ci
      - run: npm run build

      - name: Seed MySQL
        run: mysql -h 127.0.0.1 -uroot -proot < scripts/seed-mysql.sql

      - name: cargo test (against Redis and MySQL)
        run: cargo test
        working-directory: src-tauri

  # The macOS app renders with WebKit, so the browser tests run in WebKit.
  e2e:
    name: E2E (WebKit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            test-results
            playwright-report
          retention-days: 7
