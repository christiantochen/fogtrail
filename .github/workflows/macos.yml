name: macOS check

# Same checks as CI, on macOS only. Runs weekly and on demand rather than on
# every push, because GitHub's macOS runners are often queued for a long time.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # The frontend must be built first: tauri::generate_context! reads ../dist.
      - run: npm run build

      - name: rustfmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      # Unit tests only; the integration tests skip without a server (see below).
      - name: cargo test
        run: cargo test
        working-directory: src-tauri
