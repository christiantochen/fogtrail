name: Release

# Push a tag like v0.1.0, or run this workflow by hand with a tag name, to build
# installers and attach them to a draft release. A manual run creates the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0 (must match the app version)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  verify:
    name: Check version matches tag
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with app versions
        run: |
          tag="${RELEASE_TAG#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          pkg=$(jq -r .version package.json)
          echo "tag=$tag tauri.conf=$conf Cargo.toml=$cargo package.json=$pkg"
          [ "$tag" = "$conf" ] && [ "$tag" = "$cargo" ] && [ "$tag" = "$pkg" ] || {
            echo "::error::Tag $RELEASE_TAG does not match the version in all three files"; exit 1; }

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          text=$(node scripts/release.mjs --notes "$RELEASE_TAG")
          [ -n "$text" ] || text="See the assets below to download."
          v="${RELEASE_TAG#v}"
          {
            echo "notes<<NOTES_EOF"
            echo "### Download"
            echo
            echo "| Your system | File |"
            echo "| --- | --- |"
            echo "| macOS, Apple Silicon (M1 and newer) | \`Fogtrail_${v}_aarch64.dmg\` |"
            echo "| Windows | \`Fogtrail_${v}_x64-setup.exe\` |"
            echo
            echo "The other files (\`.tar.gz\`, \`.sig\`, \`latest.json\`) are used by the in-app updater."
            echo "Builds are not code-signed yet, see the README for first-launch steps."
            echo
            echo "$text"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # One job creates the draft, so the three builds below add to the same release
  # instead of each making their own.
  draft:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.verify.outputs.notes }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\" and .draft)][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$RELEASE_TAG" -f name="Fogtrail $RELEASE_TAG" -f body="$NOTES" \
              -F draft=true --jq .id)
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [verify, draft]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  # latest.json is what installed apps read; make sure every platform made it in.
  check:
    name: Check update manifest
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .url' > url.txt
          [ -s url.txt ] || { echo "::error::latest.json is missing from the release"; exit 1; }
          gh api -H "Accept: application/octet-stream" "$(cat url.txt)" > latest.json
          jq -r '.platforms | keys[]' latest.json
          for p in darwin-aarch64 windows-x86_64; do
            jq -e --arg p "$p" '.platforms | keys | map(startswith($p)) | any' latest.json >/dev/null \
              || { echo "::error::latest.json has no $p entry"; exit 1; }
          done
