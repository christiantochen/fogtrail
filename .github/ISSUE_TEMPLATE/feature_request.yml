name: Feature request
description: Suggest an improvement or something new
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or the annoyance, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Fogtrail to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you tried
      description: Workarounds, or how other tools handle it.
  - type: markdown
    attributes:
      value: |
        Fogtrail is a read-only browser, so anything that writes to the server
        (editing or deleting keys) is out of scope.
